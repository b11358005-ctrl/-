name: Build Windows Desktop EXE

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build StockMultiAgent.exe via PyInstaller
        run: python build/build_desktop.py

      - name: Upload StockMultiAgent.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMultiAgent-Windows-exe
          path: dist/StockMultiAgent.exe
          if-no-files-found: error
